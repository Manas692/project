<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            /* Unique animated gradient background */
            background: linear-gradient(-45deg, #000000, #1a1a1a, #2c3e50, #000000);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        header {
            background-color: rgba(17, 17, 17, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #3498db;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
        }
        header p {
            color: #ccc;
            margin-top: 5px;
        }
        .container {
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
            background-color: rgba(26, 26, 26, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #000;
            color: #fff;
            resize: none;
        }
        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-radius: 6px;
        }
        .real {
            background-color: #2ecc71;
            color: white;
        }
        .fake {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>📰 Fake News Detector</h1>
        <p>Check if a news headline is real or fake instantly</p>
    </header>

    <div class="container">
        <textarea id="newsInput" placeholder="Paste your news text here..."></textarea>
        <button onclick="checkNews()">Check News</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        function checkNews() {
            let text = document.getElementById("newsInput").value;
            let resultBox = document.getElementById("result");

            if (text.trim() === "") {
                resultBox.innerHTML = "⚠️ Please enter some text!";
                resultBox.className = "result";
                return;
            }

            // Expanded fake-news keyword list
            const fakeWords = [
                "click here", "shocking", "breaking", "exclusive", "viral",
                "must see", "unbelievable", "miracle", "secret", "urgent",
                "limited offer", "you won’t believe"
            ];

            let isFake = fakeWords.some(word => text.toLowerCase().includes(word));

            if (isFake) {
                resultBox.innerHTML = "❌ Fake News Detected!";
                resultBox.className = "result fake";
            } else {
                resultBox.innerHTML = "✅ Real News Detected!";
                resultBox.className = "result real";
            }
        }
    </script>
</body>
</html>
